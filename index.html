<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Palette Using Position</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">COLOR SHADES</h1>

    <div class="palette">
        <h3 class="blue-text">BLUE COLOR SHADES</h3>
        <div class="circles blue">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="palette">
        <h3 class="red-text">RED COLOR SHADES</h3>
        <div class="circles red">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="palette">
        <h3 class="green-text">GREEN COLOR SHADES</h3>
        <div class="circles green">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="palette">
        <h3 class="purple-text">PURPLE COLOR SHADES</h3>
        <div class="circles purple">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="palette">
        <h3 class="brown-text">BROWN COLOR SHADES</h3>
        <div class="circles brown">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="palette">
        <h3 class="yellow-text">YELLOW COLOR SHADES</h3>
        <div class="circles yellow">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

</body>
</html>
